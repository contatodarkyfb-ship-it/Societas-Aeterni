<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Societas Aeterni - Terminal</title>
<style>
:root{--bg:#111318;--panel:#1B1E24;--panel2:#252A33;--text:#E5E7EB;--muted:#8A8F98;--line:#323844;--accent:#6b7a99;
box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;font-size:14px;user-select:none}
#desktop{position:fixed;inset:0;bottom:44px;padding-top:env(safe-area-inset-top,0px);
background:radial-gradient(ellipse at 30% 20%,#1d222c 0%,#111318 60%,#0b0c10 100%)}
#desktop::before{content:'';position:absolute;inset:0;background-image:var(--wallpaper-logo);background-repeat:no-repeat;background-position:center;background-size:min(46vmin,380px);opacity:.18;filter:brightness(.85) saturate(.7);pointer-events:none}
.icon{position:absolute;left:14px;width:88px;padding:8px 4px;text-align:center;border-radius:6px;cursor:default;transition:background .15s}
.icon:hover{background:rgba(255,255,255,.08)}.icon.sel{background:rgba(107,122,153,.3)}
.icon svg{width:48px;height:48px}.icon span{display:block;font-size:12px;margin-top:4px;text-shadow:0 1px 3px #000;word-break:break-word}
/* Barra de tarefas */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;background:rgba(27,30,36,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:99999;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(44px + env(safe-area-inset-bottom,0px))}
.tb{background:none;border:0;color:var(--text);height:34px;padding:0 10px;border-radius:5px;cursor:pointer;font:inherit;transition:background .15s}
.tb:hover{background:rgba(255,255,255,.1)}.tb.active{background:rgba(255,255,255,.14);border-bottom:2px solid var(--accent)}
#search{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:6px 14px;width:160px;font:inherit}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
#tray{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}
#clock{text-align:right;line-height:1.15;color:var(--text)}
#startmenu{position:fixed;left:8px;bottom:52px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:none;z-index:99998;box-shadow:0 8px 30px #000a}
#startmenu div{padding:9px 12px;border-radius:5px;cursor:pointer}#startmenu div:hover{background:var(--panel2)}
/* Janelas */
.win{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 40px #000a;display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:260px;min-height:160px;max-width:100vw;animation:open .18s ease-out}
@keyframes open{from{opacity:0;transform:scale(.95)}}
.win.closing{opacity:0;transition:opacity .15s}.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 44px)!important;border-radius:0;resize:none}
.title{display:flex;align-items:center;height:34px;background:var(--panel2);padding-left:10px;cursor:default;flex:none;touch-action:none}
.title b{flex:1;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title button{width:42px;height:34px;border:0;background:none;color:var(--text);cursor:pointer;font-size:14px}
.title button:hover{background:rgba(255,255,255,.1)}.title button.x:hover{background:#c42b1c}
.body{flex:1;overflow:auto;min-height:0;position:relative}
/* Explorador */
.bar{display:flex;gap:6px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar button{background:none;border:0;color:var(--muted);font-size:16px;width:30px;cursor:pointer}
.addr{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;color:var(--text)}
.files{display:flex;flex-wrap:wrap;gap:10px;padding:14px}
.file{width:120px;padding:8px;text-align:center;border-radius:6px;cursor:default}.file:hover{background:rgba(255,255,255,.08)}
.file svg{width:44px;height:44px}.file small{display:block;color:var(--muted)}
/* Formulários */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;min-height:100%;text-align:center}
input[type=text],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:5px;font:inherit;user-select:text}
input:focus{outline:1px solid var(--accent)}
.btn{background:#38414f;border:0;color:var(--text);padding:9px 22px;border-radius:5px;cursor:pointer;font:inherit;letter-spacing:.08em;transition:background .15s}.btn:hover{background:#4a5568}
.err{color:#e07a7a;min-height:18px;font-size:13px}.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pw{position:relative;width:100%}.pw button{position:absolute;right:4px;top:4px;background:none;border:0;color:var(--muted);cursor:pointer;padding:5px}
video{width:100%;height:100%;background:#000;display:block}
/* App Societas */
.app{display:flex;height:100%;animation:open .5s}
.side{width:150px;background:var(--bg);border-right:1px solid var(--line);padding:10px 0;flex:none}
.side div{padding:10px 18px;cursor:pointer;color:var(--muted)}.side div:hover,.side div.on{color:var(--text);background:var(--panel2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.12em;color:var(--muted)}.head b{color:var(--text);font-weight:600}
.content{padding:20px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;transition:border-color .15s}.card:hover{border-color:var(--accent)}
.card h4{margin:0 0 6px}.card p{margin:0;color:var(--muted);font-size:13px}
h2{margin:0 0 4px;font-weight:600}.sub{color:var(--muted)}
.logo{font-size:22px;letter-spacing:.3em;font-weight:600}
@media(max-width:600px){.side{width:100px}.side div{padding:10px}#search{display:none}}
/* ---- Menu de contexto (clique direito) ---- */
#ctxmenu{position:fixed;z-index:999999;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:180px;padding:6px;box-shadow:0 8px 30px #000a;display:none}
#ctxmenu div{padding:8px 14px;border-radius:4px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;color:var(--text)}
#ctxmenu div:hover{background:var(--panel2)}
#ctxmenu div.off{color:var(--muted);cursor:default}#ctxmenu div.off:hover{background:none}
#ctxmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* ---- Logo Societas Aeterni (imagem enviada) ---- */
.logo-img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 6px #0008)}
.icon .logo-img{width:48px;height:48px}
/* ---- Arquivos: explorador, redações e leitor de registros ---- */
.file.apagado{opacity:.65}
.file.disponivel{outline:1px solid #B9A15A66;border-radius:8px}
small.meta2{color:var(--muted);display:block;font-size:10px;margin-top:2px}
.toolbar2{display:flex;gap:8px;align-items:center;padding:8px 2px 14px;flex-wrap:wrap}
.toolbar2 input,.toolbar2 select{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:4px;font:inherit}
.toolbar2 input{flex:1;min-width:140px}
.doc{padding:4px 2px 18px;max-width:640px}
.doc .meta{font-size:12px;color:var(--muted);line-height:1.8;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.doc .meta b{color:var(--text);font-size:14px;letter-spacing:.03em}
.doc p{line-height:1.7;margin:0 0 10px}
.redbox{display:inline-block;height:1em;background:#000;vertical-align:middle;user-select:none}
.navrec{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;margin-top:10px}
.navrec button{background:var(--panel2);border:0;color:var(--text);padding:7px 14px;border-radius:4px;cursor:pointer;font:inherit}
.navrec button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="startmenu"></div>
<div id="ctxmenu"></div>
<div id="taskbar">
  <button class="tb" id="startbtn" title="Iniciar">⊞</button>
  <input id="search" placeholder="Pesquisar" readonly>
  <div id="tasks"></div>
  <div id="tray"><span>🔊 ⌃</span><div id="clock"></div></div>
</div>

/* =====================================================================
   ★ LINHA DO TEMPO FICCIONAL DO SISTEMA ★
   Início: 03/02/476 d.C. às 15:00 — avança 10x mais rápido que o tempo real.
   ===================================================================== */
const TEMPO_FICCIONAL = {
  inicioReal: Date.now(),
  base: new Date(476, 1, 3, 15, 0, 0), // mês 1 = fevereiro (índice 0)
  velocidade: 10
};
function dataFicticiaAtual(){
  const decorridoMs = (Date.now() - TEMPO_FICCIONAL.inicioReal) * TEMPO_FICCIONAL.velocidade;
  return new Date(TEMPO_FICCIONAL.base.getTime() + decorridoMs);
}
function formatarDataFicticia(d){
  const dia=String(d.getDate()).padStart(2,'0'), mes=String(d.getMonth()+1).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return { data:`${dia}/${mes}/${d.getFullYear()} d.C.`, hora:`${hh}:${mm}` };
}

/* =====================================================================
   ★ SONS DO SISTEMA (gerados via Web Audio API, sem arquivos externos) ★
   ===================================================================== */
const AudioCtxRef = window.AudioContext || window.webkitAudioContext;
const actx = AudioCtxRef ? new AudioCtxRef() : null;
function destravarAudio(){ if(actx && actx.state==='suspended') actx.resume(); }
document.addEventListener('pointerdown', destravarAudio, { once:true });
function tocarSom(tipo){
  if(!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.connect(gain); gain.connect(actx.destination);
  const presets = {
    clique:   { freq:520, dur:.05,  tipo_onda:'sine',   vol:.05 },
    abrir:    { freq:300, dur:.14,  tipo_onda:'sine',   vol:.06, sobe:620 },
    fechar:   { freq:420, dur:.12,  tipo_onda:'sine',   vol:.05, desce:200 },
    erro:     { freq:160, dur:.22,  tipo_onda:'square', vol:.045, desce:90 },
    sucesso:  { freq:440, dur:.16,  tipo_onda:'sine',   vol:.06, sobe:720 }
  };
  const p = presets[tipo] || presets.clique;
  osc.type = p.tipo_onda; osc.frequency.setValueAtTime(p.freq, t0);
  if(p.sobe) osc.frequency.exponentialRampToValueAtTime(p.sobe, t0+p.dur);
  if(p.desce) osc.frequency.exponentialRampToValueAtTime(p.desce, t0+p.dur);
  gain.gain.setValueAtTime(p.vol, t0);
  gain.gain.exponentialRampToValueAtTime(.0001, t0+p.dur);
  osc.start(t0); osc.stop(t0+p.dur+.02);
}

/* =====================================================================
   SEÇÃO: JANELAS (arrastar, minimizar, maximizar, fechar, foco)
   ===================================================================== */
let zTop = 10, winCount = 0;
const wins = {};

function criarJanela({id,titulo,html,w=560,h=380,onInit}){
  if(wins[id]){ focar(id); return wins[id].el; }        // evita duplicar janelas
  const el = document.createElement('div');
  el.className='win';
  const vw = innerWidth, vh = innerHeight-44;
  w = Math.min(w,vw); h = Math.min(h,vh);
  el.style.cssText = `width:${w}px;height:${h}px;left:${Math.max(0,(vw-w)/2+winCount*24%120)}px;top:${Math.max(0,(vh-h)/2+winCount*24%80-20)}px`;
  winCount++;
  el.innerHTML = `<div class="title"><b>${titulo}</b><button data-a="min">—</button><button data-a="max">▢</button><button class="x" data-a="x">✕</button></div><div class="body">${html}</div>`;
  $('#desktop').appendChild(el);
  tocarSom('abrir');

  const tb = document.createElement('button');
  tb.className='tb'; tb.textContent=titulo.slice(0,18); $('#tasks').appendChild(tb);
  wins[id]={el,tb};

  el.addEventListener('pointerdown',()=>focar(id));
  tb.onclick=()=>{ tocarSom('clique');
    if(el.classList.contains('min')){el.classList.remove('min');focar(id);}
    else if(tb.classList.contains('active')) el.classList.add('min'),tb.classList.remove('active');
    else focar(id); };
  el.querySelector('.title').addEventListener('click',e=>{
    const a=e.target.dataset.a; if(!a) return;
    if(a==='x') fechar(id);
    if(a==='min'){ tocarSom('clique'); el.classList.add('min');tb.classList.remove('active');}
    if(a==='max') { tocarSom('clique'); el.classList.toggle('max'); }
  });
  el.querySelector('.title').addEventListener('dblclick',e=>{ if(!e.target.dataset.a) el.classList.toggle('max'); });
  arrastar(el);
  focar(id);
  onInit && onInit(el);
  return el;
}
function focar(id){
  const w=wins[id]; if(!w) return;
  w.el.classList.remove('min'); w.el.style.zIndex=++zTop;
  Object.values(wins).forEach(x=>x.tb.classList.remove('active')); w.tb.classList.add('active');
}
function fechar(id){
  const w=wins[id]; if(!w) return;
  tocarSom('fechar');
  w.el.classList.add('closing'); delete wins[id];
  setTimeout(()=>{w.el.remove();w.tb.remove();},150);
}
function arrastar(el){
  const bar=$('.title',el); let ox,oy,drag=false;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.dataset.a||el.classList.contains('max')) return;
    drag=true; ox=e.clientX-el.offsetLeft; oy=e.clientY-el.offsetTop; bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove',e=>{
    if(!drag) return;
    el.style.left=Math.min(Math.max(-el.offsetWidth+80,e.clientX-ox),innerWidth-80)+'px';
    el.style.top=Math.min(Math.max(0,e.clientY-oy),innerHeight-80)+'px';
  });
  bar.addEventListener('pointerup',()=>drag=false);
}

   ===================================================================== */
function pedirSenha(v){
  const html=`<div class="center"><div style="font-size:30px">🔒</div><div>${v.nome}</div><div class="sub">Este arquivo é protegido.</div>
  <div class="pw"><input type="password" placeholder="Digite a senha" autocomplete="off"><button type="button" title="Mostrar senha">👁</button></div>
  <div class="err"></div><button class="btn">ABRIR</button></div>`;
  criarJanela({id:'auth_'+v.id,titulo:'Autenticação — '+v.nome,html,w:340,h:330,onInit:el=>{
    const inp=$('input',el), err=$('.err',el);
    $('.pw button',el).onclick=()=>inp.type=inp.type==='password'?'text':'password';
    const tentar=()=>{
      if(eq(inp.value,v.senha)){ tocarSom('sucesso'); fechar('auth_'+v.id); abrirArquivoProtegido(v); }
      else{ tocarSom('erro'); err.textContent='Senha incorreta.'; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); }
    };
    $('.btn',el).onclick=tentar; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tentar(); }); inp.focus();
  }});
}
function abrirArquivoProtegido(v){
  if(v.tipo==='audio'){
    const ok=v.fonte && !v.fonte.startsWith('COLOCAR_');
    const html=ok?`<div class="center"><div style="font-size:40px">🎧</div><div>${v.nome}</div><audio src="${v.fonte}" controls style="width:90%;margin-top:10px"></audio></div>`
      :`<div class="center"><div style="font-size:30px">🎧</div><div>Áudio não configurado.</div><div class="sub">Defina o caminho em ARQUIVOS_PROTEGIDOS no código.</div></div>`;
    criarJanela({id:'mid_'+v.id,titulo:v.nome,html,w:420,h:260});
    return;
  }
  if(v.tipo==='fotos'){
    const validas=(v.fontes||[]).filter(f=>f && !f.startsWith('COLOCAR_'));
    if(!validas.length){
      criarJanela({id:'mid_'+v.id,titulo:v.nome,w:420,h:260,
        html:`<div class="center"><div style="font-size:30px">🖼</div><div>Fotos não configuradas.</div><div class="sub">Defina os caminhos em ARQUIVOS_PROTEGIDOS no código.</div></div>`});
      return;
    }
    let i=0;
    const nav = validas.length>1 ? `<div class="navrec" style="border:0;padding:8px 0 0"><button data-f="p">◀</button><span>Foto 1 de ${validas.length}</span><button data-f="n">▶</button></div>` : '';
    criarJanela({id:'mid_'+v.id,titulo:v.nome,w:560,h:460,
      html:`<div class="center" style="padding:10px"><img id="fotoAtual" src="${validas[0]}" style="max-width:100%;max-height:340px;border-radius:4px">${nav}</div>`,
      onInit:el=>{
        if(validas.length<=1) return;
        const img=$('#fotoAtual',el), contador=$('.navrec span',el);
        const atualizar=()=>{ img.src=validas[i]; if(contador) contador.textContent=`Foto ${i+1} de ${validas.length}`; };
        $('[data-f="p"]',el).onclick=()=>{ tocarSom('clique'); i=(i-1+validas.length)%validas.length; atualizar(); };
        $('[data-f="n"]',el).onclick=()=>{ tocarSom('clique'); i=(i+1)%validas.length; atualizar(); };
      }});
    return;
  }
  // vídeo (padrão)
  const ok=v.fonte && !v.fonte.startsWith('COLOCAR_');
  const html=ok?`<video src="${v.fonte}" controls controlsList="" playsinline preload="metadata"></video>`
    :`<div class="center"><div style="font-size:30px">🎞</div><div>Vídeo não configurado.</div><div class="sub">Defina o caminho em ARQUIVOS_PROTEGIDOS no código.</div></div>`;
  criarJanela({id:'mid_'+v.id,titulo:v.nome,html,w:720,h:460});
}

/* ---- Funções auxiliares do módulo de Arquivos ---- */
// Gera um tamanho e uma data de modificação falsos, porém estáveis, a partir do nome do arquivo
function metaArquivo(nome){
  let h=0; for(const c of nome) h=(h*31+c.charCodeAt(0))%9973;
  const kb = 38 + (h%860);
  const d = new Date(2019,8,18); d.setDate(d.getDate() + (h%34));
  return { tamanho: kb+' KB', data: d.toLocaleDateString('pt-BR') };
}
// Gera uma caixa preta proporcional ao tamanho de um nome, sem revelar o nome em nenhum lugar do HTML
function caixaNome(nome){
  const w = Math.min(170, Math.max(55, (nome||'').length*7));
  return `<span class="redbox" style="width:${w}px"></span>`;
}
// Renderiza o corpo de um documento, cobrindo trechos marcados com R(...) por um retângulo preto
function renderCorpo(linhas){
  return linhas.map(l=>{
    if(l===''||l===undefined) return '<p>&nbsp;</p>';
    if(typeof l==='object' && l.redacted){
      let h=0; for(const c of (l.label||'x')) h=(h*13+c.charCodeAt(0))%100;
      return `<p><span class="redbox" style="width:${160+(h%260)}px"></span></p>`;
    }
    return `<p>${l}</p>`;
  }).join('');
}

// Ações a executar logo após o conteúdo de certas seções ser inserido na tela
let idxRegistro = 0;
const SECOES_INIT = {
  "Registros": c => { idxRegistro = 0; desenharRegistro(c); },
  "Arquivos": c => {
    const todos = [
      ...DATABASE_DELETED_FILES.map(n=>({nome:n,tipo:'apagado'})),
      ...DATABASE_ENCRYPTED_DOCUMENTS.map(n=>({nome:n,tipo:'cripto'})),
      { nome:DATABASE_SURVIVING_FILE.nome, tipo:'disponivel' }
    ];
    const lista=$('#listaArq',c), busca=$('#buscaArq',c), ord=$('#ordArq',c);
    function desenhar(){
      let arr = todos.filter(a=>a.nome.toLowerCase().includes(busca.value.toLowerCase()));
      const meta = a => a.tipo==='disponivel' ? {tamanho:'4 KB', data:'19/10/2019'} : metaArquivo(a.nome);
      if(ord.value==='nome') arr=[...arr].sort((a,b)=>a.nome.localeCompare(b.nome));
      if(ord.value==='data') arr=[...arr].sort((a,b)=>meta(b).data.split('/').reverse().join('')-meta(a).data.split('/').reverse().join(''));
      lista.innerHTML = arr.map(a=>{
        const m = meta(a);
        const icone = a.tipo==='apagado'?SVG.apagado:a.tipo==='cripto'?SVG.cripto:SVG.disponivel;
        const rotulo = a.tipo==='apagado'?'Apagado':a.tipo==='cripto'?'Criptografado':'Disponível';
        return `<div class="file ${a.tipo==='apagado'?'apagado':a.tipo==='disponivel'?'disponivel':''}" data-n="${a.nome}" data-t="${a.tipo}">${icone}<div>${a.nome}</div><small>${rotulo} · ${m.tamanho}</small><small class="meta2">Mod.: ${m.data}</small></div>`;
      }).join('') || '<p class="sub">Nenhum arquivo encontrado.</p>';
      lista.querySelectorAll('.file').forEach(f=>{
        const ab=()=>abrirArquivo(f.dataset.n,f.dataset.t);
        f.addEventListener('dblclick',ab);
        f.addEventListener('click',()=>{ tocarSom('clique'); if(matchMedia('(pointer:coarse)').matches) ab(); });
      });
    }
    busca.oninput=desenhar; ord.onchange=desenhar; desenhar();
  }
};

function desenharRegistro(c){
  const r = DATABASE_RECORDS[idxRegistro];
  const wrap = $('#regWrap',c);
  wrap.innerHTML = `<div class="doc"><div class="meta"><b>${r.title}</b><br>Autor: ${caixaNome(r.author)}<br>Data: ${r.date} · ${r.time}<br>Registro: ${r.id}</div>${renderCorpo(r.content)}</div>
  <div class="navrec"><button id="rPrev" ${idxRegistro===0?'disabled':''}>◀ REGISTRO ANTERIOR</button><span>Registro ${idxRegistro+1} de ${DATABASE_RECORDS.length}</span><button id="rNext" ${idxRegistro===DATABASE_RECORDS.length-1?'disabled':''}>REGISTRO SEGUINTE ▶</button></div>`;
  $('#rPrev',wrap).onclick=()=>{ if(idxRegistro>0){ tocarSom('clique'); idxRegistro--; desenharRegistro(c); } };
  $('#rNext',wrap).onclick=()=>{ if(idxRegistro<DATABASE_RECORDS.length-1){ tocarSom('clique'); idxRegistro++; desenharRegistro(c); } };
}

function abrirArquivo(nome,tipo){
  if(tipo==='apagado'){
    tocarSom('erro');
    const msg = MENSAGENS_APAGADO[Math.floor(Math.random()*MENSAGENS_APAGADO.length)];
    criarJanela({id:'del_'+nome, titulo:nome, w:360, h:210,
      html:`<div class="center"><div style="font-size:26px">⚠</div><div>${msg}</div><div class="sub">Este arquivo foi removido do sistema.</div></div>`});
    return;
  }
  if(tipo==='cripto'){
    tocarSom('erro');
    criarJanela({id:'enc_'+nome, titulo:nome, w:380, h:220,
      html:`<div class="center"><div style="font-size:26px">🔒</div><div>CONTEÚDO PROTEGIDO.</div><div class="sub">CHAVE DE DESCRIPTOGRAFIA NÃO LOCALIZADA.</div></div>`});
    return;
  }
  tocarSom('sucesso');
  const f = DATABASE_SURVIVING_FILE;
  criarJanela({id:'surv', titulo:f.nome, w:620, h:520,
    html:`<div class="doc"><div class="meta"><b>${f.titulo}</b><br>Classificação: ${f.classificacao}<br>Autor: ${f.autor}</div>${renderCorpo(f.corpo)}</div>`});
}

function montarApp(body){

  <div class="main"><div class="head"><b>SOCIETAS AETERNI</b><span>ACESSO AUTORIZADO</span><span>usuário: ${LOGIN.nome}</span></div><div class="content"></div></div></div>`;
  const ir=k=>{ tocarSom('clique'); body.querySelectorAll('.side div').forEach(d=>d.classList.toggle('on',d.dataset.s===k));
    const c=$('.content',body); c.innerHTML=SECOES[k]();
    c.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>ir(x.dataset.go));
    if(SECOES_INIT[k]) SECOES_INIT[k](c); };
  body.querySelectorAll('.side div').forEach(d=>d.onclick=()=>ir(d.dataset.s));
  ir("Início");
}
